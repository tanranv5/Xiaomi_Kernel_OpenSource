name: build-laurus-sukisu

"on":
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "要编译的内核分支"
        required: true
        default: "laurus-q-oss-ci"
      defconfig:
        description: "defconfig（相对 arch/arm64/configs/）"
        required: true
        default: "vendor/laurus-perf_defconfig"
      sukisu_ref:
        description: "SukiSU Ultra 引用（分支/标签/commit）"
        required: true
        default: "main"
      sukisu_mode:
        description: "SukiSU 集成模式：builtin 更适合非 GKI/老内核"
        required: true
        default: "builtin"
        type: choice
        options:
          - builtin
          - main
      fortify:
        description: "是否启用 FORTIFY_SOURCE（推荐日用 on；老 GCC 4.9 需先修触发点再开启）"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      build_dtbo:
        description: "是否构建 DTBO（overlay）；off 会绕过 trinket dtbo 编译失败（先确保内核能出镜像）"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      gcc64_repo:
        description: "AArch64 GCC 4.9 工具链仓库"
        required: true
        default: "LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9"
      gcc64_ref:
        description: "AArch64 GCC 4.9 工具链分支"
        required: true
        default: "lineage-19.1"
      gcc32_repo:
        description: "ARM GCC 4.9 工具链仓库"
        required: true
        default: "LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9"
      gcc32_ref:
        description: "ARM GCC 4.9 工具链分支"
        required: true
        default: "lineage-19.1"
  push:
    branches:
      - laurus-q-oss-ci
    paths:
      - ".github/workflows/laurus_sukisu.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      WITH_SUKISU: "on"
      KERNEL_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.kernel_branch || 'laurus-q-oss-ci' }}
      DEFCONFIG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'vendor/laurus-perf_defconfig' }}
      SUKISU_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.sukisu_ref || 'main' }}
      SUKISU_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.sukisu_mode || 'builtin' }}
      FORTIFY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.fortify || 'off' }}
      BUILD_DTBO: ${{ github.event_name == 'workflow_dispatch' && inputs.build_dtbo || 'off' }}
      GCC64_REPO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.gcc64_repo || 'LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9' }}
      GCC64_REF_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.gcc64_ref || 'lineage-19.1' }}
      GCC32_REPO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.gcc32_repo || 'LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9' }}
      GCC32_REF_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.gcc32_ref || 'lineage-19.1' }}
      RUN_ID: ${{ github.run_id }}
      HEAD_SHA: ${{ github.sha }}

    steps:
      - name: 检出内核源码
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ env.KERNEL_BRANCH }}

      - name: 安装依赖
        id: deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates \
            curl flex git libelf-dev libssl-dev \
            python3 rsync unzip xz-utils \
            device-tree-compiler zip

      - name: 拉取工具链（GCC 4.9）
        id: toolchain
        run: |
          set -euxo pipefail
          GCC64_REPO="${GCC64_REPO_INPUT}"
          GCC64_REF="${GCC64_REF_INPUT}"
          GCC32_REPO="${GCC32_REPO_INPUT}"
          GCC32_REF="${GCC32_REF_INPUT}"

          git clone --depth=1 -b "$GCC64_REF" "https://github.com/${GCC64_REPO}.git" toolchain-gcc64
          git clone --depth=1 -b "$GCC32_REF" "https://github.com/${GCC32_REPO}.git" toolchain-gcc32

          echo "TOOLCHAIN_GCC64=$PWD/toolchain-gcc64" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_GCC32=$PWD/toolchain-gcc32" >> "$GITHUB_ENV"

      - name: 集成 SukiSU Ultra
        id: sukisu
        run: |
          set -euxo pipefail
          if [ "${WITH_SUKISU}" != "on" ]; then
            echo "WITH_SUKISU=${WITH_SUKISU}, skip SukiSU integrate."
            exit 0
          fi

          ref="${SUKISU_REF}"
          mode="${SUKISU_MODE}"

          # SukiSU 官方脚本
          curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${ref}/kernel/setup.sh" | bash -s "$mode"

          # 应用 manual hook 补丁（4.14）
          patch_url="https://raw.githubusercontent.com/rksuorg/kernel_patches/master/manual_hook/kernel-4.14.patch"
          curl -fsSL "$patch_url" -o /tmp/ksu_manual_hook.patch
          if git apply --reverse --check /tmp/ksu_manual_hook.patch 2>/dev/null; then
            echo "manual hook patch already applied"
          elif git apply /tmp/ksu_manual_hook.patch 2>/dev/null; then
            echo "manual hook patch applied successfully"
          else
            echo "git patch failed, applying manual hooks via Python"
            python3 - <<'PATCH_VFS_READ'
          import re
          from pathlib import Path

          # Patch fs/read_write.c
          rw_path = Path("fs/read_write.c")
          rw_text = rw_path.read_text()
          if "ksu_handle_vfs_read" not in rw_text:
              decl = (
                  "#ifdef CONFIG_KSU\n"
                  "extern bool ksu_vfs_read_hook __read_mostly;\n"
                  "extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,\n"
                  "                             size_t *count_ptr, loff_t **pos);\n"
                  "#endif\n"
              )
              hook = (
                  "\n#ifdef CONFIG_KSU\n"
                  "\tif (unlikely(ksu_vfs_read_hook))\n"
                  "\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n"
                  "#endif\n"
              )
              # Insert declaration before vfs_read
              rw_text = re.sub(
                  r"(ssize_t vfs_read\(struct file \*file, char __user \*buf, size_t count, loff_t \*pos\)\n\{)",
                  decl + r"\1",
                  rw_text
              )
              # Insert hook after ssize_t ret;
              rw_text = re.sub(
                  r"(ssize_t vfs_read\(struct file \*file, char __user \*buf, size_t count, loff_t \*pos\)\n\{\n\tssize_t ret;)",
                  r"\1" + hook,
                  rw_text
              )
              rw_path.write_text(rw_text)
              print("Patched fs/read_write.c with vfs_read hook")

          # Patch fs/exec.c
          exec_path = Path("fs/exec.c")
          exec_text = exec_path.read_text()
          if "ksu_handle_execveat" not in exec_text:
              decl = (
                  "#ifdef CONFIG_KSU\n"
                  "extern bool ksu_execveat_hook __read_mostly;\n"
                  "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,\n"
                  "\t\t\tvoid *envp, int *flags);\n"
                  "extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,\n"
                  "\t\t\t\t void *argv, void *envp, int *flags);\n"
                  "#endif\n"
              )
              hook = (
                  "\n#ifdef CONFIG_KSU\n"
                  "\tif (unlikely(ksu_execveat_hook))\n"
                  "\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                  "\telse\n"
                  "\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n"
                  "#endif\n"
              )
              # Insert declaration before do_execveat_common
              exec_text = re.sub(
                  r"(static int do_execveat_common\(int fd, struct filename \*filename,)",
                  decl + r"\1",
                  exec_text
              )
              # Insert hook after int retval;
              exec_text = re.sub(
                  r"(static int do_execveat_common\(int fd, struct filename \*filename,.*?int retval;)",
                  r"\1" + hook,
                  exec_text,
                  count=1,
                  flags=re.S
              )
              exec_path.write_text(exec_text)
              print("Patched fs/exec.c with execveat hook")

          # Patch drivers/input/input.c
          input_path = Path("drivers/input/input.c")
          if input_path.exists():
              input_text = input_path.read_text()
              if "ksu_handle_input" not in input_text:
                  decl = (
                      "#ifdef CONFIG_KSU\n"
                      "extern bool ksu_input_hook __read_mostly;\n"
                      "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
                      "#endif\n"
                  )
                  hook = (
                      "\n#ifdef CONFIG_KSU\n"
                      "\tif (unlikely(ksu_input_hook))\n"
                      "\t\tksu_handle_input_handle_event(&type, &code, &value);\n"
                      "#endif\n"
                  )
                  input_text = re.sub(
                      r"(static void input_handle_event\(struct input_dev \*dev,)",
                      decl + r"\1",
                      input_text
                  )
                  input_text = re.sub(
                      r"(int disposition = input_get_disposition\(dev, type, code, &value\);)",
                      r"\1" + hook,
                      input_text
                  )
                  input_path.write_text(input_text)
                  print("Patched drivers/input/input.c with input hook")

          print("Manual hook patches complete")
          PATCH_VFS_READ
          fi

          # 补齐 manual hook 适配符号，避免链接错误
          if [ -d "common/drivers" ]; then
            ksu_dir="common/drivers/kernelsu"
          else
            ksu_dir="drivers/kernelsu"
          fi

          # 修正 4.14 syscall 符号名（laurus 使用 sys_*，避免 kprobe 失效）
          python3 - <<PY
          from pathlib import Path

          path = Path("${ksu_dir}") / "arch.h"
          text = path.read_text()
          text = text.replace('#define SYS_READ_SYMBOL "__arm64_sys_read"', '#define SYS_READ_SYMBOL "sys_read"')
          text = text.replace('#define SYS_EXECVE_SYMBOL "__arm64_sys_execve"', '#define SYS_EXECVE_SYMBOL "sys_execve"')
          text = text.replace('#define SYS_FSTAT_SYMBOL "__arm64_sys_newfstat"', '#define SYS_FSTAT_SYMBOL "sys_newfstat"')
          path.write_text(text)
          PY

          # 补齐 manual hook 需要的钩子实现，避免空函数导致 init.rc 注入失败
          export KSU_DIR="$ksu_dir"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          ksu_dir = Path(os.environ["KSU_DIR"])
          sucompat_path = ksu_dir / "sucompat.c"
          su_text = sucompat_path.read_text()
          if "ksu_handle_execveat_sucompat" not in su_text:
              insert = (
                  "\nint ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,\n"
                  "                               void *argv, void *envp, int *flags)\n"
                  "{\n"
                  "    struct filename *filename;\n"
                  "\n"
                  "    if (!filename_ptr)\n"
                  "        return 0;\n"
                  "\n"
                  "    filename = *filename_ptr;\n"
                  "    if (IS_ERR(filename))\n"
                  "        return 0;\n"
                  "\n"
                  "    if (strcmp(filename->name, SU_PATH))\n"
                  "        return 0;\n"
                  "\n"
                  "    struct filename *newf = getname_kernel(KSUD_PATH);\n"
                  "    if (!IS_ERR(newf)) {\n"
                  "        putname(filename);\n"
                  "        *filename_ptr = newf;\n"
                  "        escape_with_root_profile();\n"
                  "    }\n"
                  "\n"
                  "    return 0;\n"
                  "}\n"
              )
              sucompat_path.write_text(su_text + insert)

          ksud_path = ksu_dir / "ksud.c"
          ksud_text = ksud_path.read_text()
          vfs_body = (
              "\nextern bool ksu_execveat_hook __read_mostly;\n"
              "extern bool ksu_vfs_read_hook __read_mostly;\n"
              "extern bool ksu_input_hook __read_mostly;\n"
              "\nbool vfs_read_hook_ready __read_mostly = true;\n"
              "bool vfs_read_hook_locked __read_mostly = false;\n"
              "\nstatic bool ksu_match_init_rc_path(struct file *file)\n"
              "{\n"
              "    char path[256];\n"
              "    char *dpath;\n"
              "\n"
              "    if (!file)\n"
              "        return false;\n"
              "\n"
              "    dpath = d_path(&file->f_path, path, sizeof(path));\n"
              "    if (IS_ERR(dpath))\n"
              "        return false;\n"
              "\n"
              "    if (!strcmp(dpath, \"/system/etc/init/hw/init.rc\"))\n"
              "        return true;\n"
              "    if (!strcmp(dpath, \"/system/etc/init/init.rc\"))\n"
              "        return true;\n"
              "    if (!strcmp(dpath, \"/init.rc\"))\n"
              "        return true;\n"
              "\n"
              "    return false;\n"
              "}\n"
              "\nint ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,\n"
              "                        size_t *count_ptr, loff_t **pos)\n"
              "{\n"
              "    struct file *file;\n"
              "    const char *name;\n"
              "\n"
              "    if (!vfs_read_hook_ready || vfs_read_hook_locked)\n"
              "        return 0;\n"
              "\n"
              "    if (!file_ptr)\n"
              "        return 0;\n"
              "\n"
              "    file = *file_ptr;\n"
              "    if (!file)\n"
              "        return 0;\n"
              "\n"
              "    if (current->pid != 1)\n"
              "        return 0;\n"
              "    if (strcmp(current->comm, \"init\"))\n"
              "        return 0;\n"
              "    if (!file->f_inode || !S_ISREG(file->f_inode->i_mode))\n"
              "        return 0;\n"
              "\n"
              "    name = file->f_path.dentry->d_name.name;\n"
              "    if (!name || strcmp(name, \"init.rc\"))\n"
              "        return 0;\n"
              "    if (!ksu_match_init_rc_path(file))\n"
              "        return 0;\n"
              "\n"
              "    vfs_read_hook_locked = true;\n"
              "    pr_info(\"read init.rc(vfs_read), comm: %s, rc_count: %zu\\n\", current->comm, ksu_rc_len);\n"
              "\n"
              "    memcpy(&fops_proxy, file->f_op, sizeof(struct file_operations));\n"
              "    orig_read = file->f_op->read;\n"
              "    if (orig_read) {\n"
              "        fops_proxy.read = read_proxy;\n"
              "    }\n"
              "    orig_read_iter = file->f_op->read_iter;\n"
              "    if (orig_read_iter) {\n"
              "        fops_proxy.read_iter = read_iter_proxy;\n"
              "    }\n"
              "    file->f_op = &fops_proxy;\n"
              "    ksu_vfs_read_hook = false;\n"
              "\n"
              "    return 0;\n"
              "}\n"
          )
          pattern = r'\n(?:static\\s+)?(?:__weak\\s+)?int\\s+ksu_handle_vfs_read\\s*\\([^)]*\\)\\s*\\{.*?\\n\\}'
          if re.search(pattern, ksud_text, flags=re.S):
              ksud_text = re.sub(pattern, vfs_body, ksud_text, flags=re.S)
              ksud_path.write_text(ksud_text)
          else:
              marker = "static void ksu_handle_sys_read"
              if marker in ksud_text:
                  ksud_text = ksud_text.replace(marker, vfs_body + "\\n" + marker, 1)
                  ksud_path.write_text(ksud_text)
              else:
                  marker = "static bool is_init_rc(struct file *fp)"
                  idx = ksud_text.find(marker)
                  if idx == -1:
                      raise SystemExit("ksud.c missing is_init_rc marker")
                  brace_start = ksud_text.find("{", idx)
                  if brace_start == -1:
                      raise SystemExit("ksud.c missing is_init_rc brace")
                  depth = 0
                  end = None
                  for i in range(brace_start, len(ksud_text)):
                      if ksud_text[i] == "{":
                          depth += 1
                      elif ksud_text[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
              if end is None:
                  raise SystemExit("ksud.c missing is_init_rc end")
              ksud_text = ksud_text[:end] + vfs_body + ksud_text[end:]
              ksud_path.write_text(ksud_text)

          ksud_text = ksud_path.read_text()
          anchor = '#include "ksud.h"\\n'
          if anchor in ksud_text:
              insert = ""
              if "ksu_execveat_hook" not in ksud_text:
                  insert += (
                      "extern bool ksu_execveat_hook __read_mostly;\\n"
                      "extern bool ksu_vfs_read_hook __read_mostly;\\n"
                      "extern bool ksu_input_hook __read_mostly;\\n"
                  )
              if "extern bool vfs_read_hook_ready" not in ksud_text:
                  insert += (
                      "extern bool vfs_read_hook_ready __read_mostly;\\n"
                      "extern bool vfs_read_hook_locked __read_mostly;\\n"
                  )
              if insert:
                  ksud_text = ksud_text.replace(anchor, anchor + "\\n" + insert, 1)
          if "vfs_read_hook_ready" in ksud_text:
              marker = "            pr_info(\"/system/bin/init second_stage executed\\n\");\\n"
              if marker in ksud_text and "vfs_read_hook_ready = true;" not in ksud_text:
                  ksud_text = ksud_text.replace(
                      marker,
                      marker + "            vfs_read_hook_ready = true;\\n",
                      1,
                  )
          if "ksu_vfs_read_hook" in ksud_text:
              if "skip sys_read/sys_fstat kprobe" not in ksud_text:
                  ksud_text = ksud_text.replace(
                      "    ret = register_kprobe(&sys_read_kp);\\n"
                      "    pr_info(\\\"ksud: sys_read_kp: %d\\\\n\\\", ret);\\n\\n"
                      "    ret = register_kretprobe(&sys_fstat_kp);\\n"
                      "    pr_info(\\\"ksud: sys_fstat_kp: %d\\\\n\\\", ret);\\n",
                      "    if (!ksu_vfs_read_hook) {\\n"
                      "        ret = register_kprobe(&sys_read_kp);\\n"
                      "        pr_info(\\\"ksud: sys_read_kp: %d\\\\n\\\", ret);\\n\\n"
                      "        ret = register_kretprobe(&sys_fstat_kp);\\n"
                      "        pr_info(\\\"ksud: sys_fstat_kp: %d\\\\n\\\", ret);\\n"
                      "    } else {\\n"
                      "        pr_info(\\\"ksud: skip sys_read/sys_fstat kprobe (vfs_read hook enabled)\\\\n\\\");\\n"
                      "    }\\n",
                      1,
                  )
              if "if (ksu_vfs_read_hook)" not in ksud_text:
                  ksud_text = ksud_text.replace(
                      "static void stop_init_rc_hook()\\n{\\n",
                      "static void stop_init_rc_hook()\\n{\\n"
                      "    if (ksu_vfs_read_hook) {\\n"
                      "        return;\\n"
                      "    }\\n",
                      1,
                  )
          ksud_path.write_text(ksud_text)
          PY

          cat > "${ksu_dir}/manual_hook_adapters.c" <<'EOF'
          #include <linux/compiler.h>
          #include <linux/cred.h>
          #include <linux/err.h>
          #include <linux/fs.h>
          #include <linux/namei.h>
          #include <linux/printk.h>
          #include <linux/string.h>
          #include <linux/version.h>

          #include "allowlist.h"
          #include "app_profile.h"
          #include "ksud.h"

          struct user_arg_ptr;
          int ksu_handle_execveat_ksud(int *fd, struct filename **filename_ptr,
                                       struct user_arg_ptr *argv,
                                       struct user_arg_ptr *envp, int *flags);

          int __weak ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid)
          {
              return 0;
          }

          // 弱符号：若 ksud.c 已定义强符号则避免重复定义
          bool ksu_execveat_hook __read_mostly __weak = true;
          bool ksu_vfs_read_hook __read_mostly __weak = true;
          bool ksu_input_hook __read_mostly __weak = true;

          EXPORT_SYMBOL(ksu_execveat_hook);
          EXPORT_SYMBOL(ksu_vfs_read_hook);
          EXPORT_SYMBOL(ksu_input_hook);

          int __weak ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                                         void *argv, void *envp, int *flags)
          {
              struct user_arg_ptr *argv_ptr = (struct user_arg_ptr *)argv;
              struct user_arg_ptr *envp_ptr = (struct user_arg_ptr *)envp;

              ksu_handle_execveat_ksud(fd, filename_ptr, argv_ptr, envp_ptr, flags);

              if (!ksu_is_allow_uid_for_current(current_uid().val)) {
                  return 0;
              }
              if (!filename_ptr || !*filename_ptr || IS_ERR(*filename_ptr)) {
                  return 0;
              }

              if (!strcmp((*filename_ptr)->name, "/system/bin/su")) {
                  struct filename *newf = getname_kernel(KSUD_PATH);
                  if (!IS_ERR(newf)) {
                      putname(*filename_ptr);
                      *filename_ptr = newf;
                      escape_with_root_profile();
                  }
              }

              return 0;
          }

          int __weak ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
                                                  void *argv, void *envp, int *flags)
          {
              return 0;
          }

          EOF

          if [ -f "${ksu_dir}/Kbuild" ]; then
            if ! grep -q "manual_hook_adapters.o" "${ksu_dir}/Kbuild"; then
              echo "kernelsu-objs += manual_hook_adapters.o" >> "${ksu_dir}/Kbuild"
            fi
          fi
          if [ -f "${ksu_dir}/Makefile" ]; then
            if ! grep -q "manual_hook_adapters.o" "${ksu_dir}/Makefile"; then
              echo "kernelsu-objs += manual_hook_adapters.o" >> "${ksu_dir}/Makefile"
            fi
          fi

          # 兼容 setuid/setreuid，确保 manager fd 能注入
          python3 - <<PY
          from pathlib import Path

          ksu_dir = Path("${ksu_dir}")
          hook_manager = ksu_dir / "syscall_hook_manager.c"
          syscall_handler = ksu_dir / "syscall_handler.c"

          def patch_syscall_hook_manager(path: Path) -> None:
              text = path.read_text()
              if "__NR_setuid" not in text:
                  text = text.replace(
                      "    case __NR_setresuid:\n",
                      "    case __NR_setresuid:\n"
                      "#ifdef __NR_setuid\n"
                      "    case __NR_setuid:\n"
                      "#endif\n"
                      "#ifdef __NR_setreuid\n"
                      "    case __NR_setreuid:\n"
                      "#endif\n",
                  )

              marker = (
                  "        // Handle setresuid\n"
                  "        if (id == __NR_setresuid) {\n"
                  "            uid_t ruid = (uid_t)PT_REGS_PARM1(regs);\n"
                  "            uid_t euid = (uid_t)PT_REGS_PARM2(regs);\n"
                  "            uid_t suid = (uid_t)PT_REGS_PARM3(regs);\n"
                  "            ksu_handle_setresuid(ruid, euid, suid);\n"
                  "            return;\n"
                  "        }\n"
              )
              if marker in text and "Handle setuid" not in text:
                  insert = (
                      "#ifdef __NR_setuid\n"
                      "        // Handle setuid\n"
                      "        if (id == __NR_setuid) {\n"
                      "            uid_t uid = (uid_t)PT_REGS_PARM1(regs);\n"
                      "            ksu_handle_setresuid(uid, uid, uid);\n"
                      "            return;\n"
                      "        }\n"
                      "#endif\n"
                      "#ifdef __NR_setreuid\n"
                      "        // Handle setreuid\n"
                      "        if (id == __NR_setreuid) {\n"
                      "            uid_t ruid = (uid_t)PT_REGS_PARM1(regs);\n"
                      "            uid_t euid = (uid_t)PT_REGS_PARM2(regs);\n"
                      "            uid_t new_uid = (uid_t)-1;\n"
                      "            if (ruid != (uid_t)-1) {\n"
                      "                new_uid = ruid;\n"
                      "            } else if (euid != (uid_t)-1) {\n"
                      "                new_uid = euid;\n"
                      "            } else {\n"
                      "                new_uid = current_uid().val;\n"
                      "            }\n"
                      "            ksu_handle_setresuid(new_uid, new_uid, new_uid);\n"
                      "            return;\n"
                      "        }\n"
                      "#endif\n"
                  )
                  text = text.replace(marker, marker + insert)

              path.write_text(text)

          def patch_syscall_handler(path: Path) -> None:
              text = path.read_text()
              if "__NR_setuid" not in text:
                  text = text.replace(
                      "    case __NR_setresuid:\n",
                      "    case __NR_setresuid:\n"
                      "#ifdef __NR_setuid\n"
                      "    case __NR_setuid:\n"
                      "#endif\n"
                      "#ifdef __NR_setreuid\n"
                      "    case __NR_setreuid:\n"
                      "#endif\n",
                  )

              marker = (
                  "        if (id == __NR_setresuid) {\n"
                  "            uid_t ruid = (uid_t)PT_REGS_PARM1(regs);\n"
                  "            uid_t euid = (uid_t)PT_REGS_PARM2(regs);\n"
                  "            uid_t suid = (uid_t)PT_REGS_PARM3(regs);\n"
                  "            ksu_handle_setresuid(ruid, euid, suid);\n"
                  "            return;\n"
                  "        }\n"
              )
              if marker in text and "__NR_setuid" not in text:
                  insert = (
                      "#ifdef __NR_setuid\n"
                      "        if (id == __NR_setuid) {\n"
                      "            uid_t uid = (uid_t)PT_REGS_PARM1(regs);\n"
                      "            ksu_handle_setresuid(uid, uid, uid);\n"
                      "            return;\n"
                      "        }\n"
                      "#endif\n"
                      "#ifdef __NR_setreuid\n"
                      "        if (id == __NR_setreuid) {\n"
                      "            uid_t ruid = (uid_t)PT_REGS_PARM1(regs);\n"
                      "            uid_t euid = (uid_t)PT_REGS_PARM2(regs);\n"
                      "            uid_t new_uid = (uid_t)-1;\n"
                      "            if (ruid != (uid_t)-1) {\n"
                      "                new_uid = ruid;\n"
                      "            } else if (euid != (uid_t)-1) {\n"
                      "                new_uid = euid;\n"
                      "            } else {\n"
                      "                new_uid = current_uid().val;\n"
                      "            }\n"
                      "            ksu_handle_setresuid(new_uid, new_uid, new_uid);\n"
                      "            return;\n"
                      "        }\n"
                      "#endif\n"
                  )
                  text = text.replace(marker, marker + insert)

              path.write_text(text)

          if hook_manager.exists():
              patch_syscall_hook_manager(hook_manager)
          elif syscall_handler.exists():
              patch_syscall_handler(syscall_handler)
          else:
              print("skip setuid/setreuid patch: no syscall hook file found")
          PY

          # manual hook 下直接在 kernel/sys.c 触发 setuid/setresuid
          python3 - <<'PY'
          from pathlib import Path

          path = Path("kernel/sys.c")
          if not path.exists():
              print("skip sys.c patch: kernel/sys.c not found")
              raise SystemExit(0)

          text = path.read_text()

          decl = (
              "#ifdef CONFIG_KSU\n"
              "extern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n"
              "#endif\n"
          )

          if "extern int ksu_handle_setresuid" not in text:
              marker = "#include <linux/cred.h>\n"
              if marker in text:
                  text = text.replace(marker, marker + "\n" + decl + "\n", 1)
              else:
                  text = decl + "\n" + text

          def patch_func(text: str, signature: str, args: str) -> str:
              start = text.find(signature)
              if start == -1:
                  return text
              brace_start = text.find("{", start)
              if brace_start == -1:
                  return text

              depth = 0
              end = None
              for i in range(brace_start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  return text

              block = text[start:end]
              if "ksu_handle_setresuid" in block:
                  return text

              target = "return commit_creds(new);"
              idx = block.rfind(target)
              if idx == -1:
                  return text

              line_start = block.rfind("\n", 0, idx) + 1
              indent = block[line_start:idx]
              insert = (
                  f"{indent}#ifdef CONFIG_KSU\n"
                  f"{indent}ksu_handle_setresuid({args});\n"
                  f"{indent}#endif\n"
              )
              block = block[:idx] + insert + block[idx:]
              return text[:start] + block + text[end:]

          text = patch_func(
              text,
              "SYSCALL_DEFINE1(setuid, uid_t, uid)",
              "uid, uid, uid",
          )
          text = patch_func(
              text,
              "SYSCALL_DEFINE3(setresuid, uid_t, ruid, uid_t, euid, uid_t, suid)",
              "ruid, euid, suid",
          )

          path.write_text(text)
          PY

      - name: 配置 defconfig
        id: config
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAIN_GCC64/bin:$TOOLCHAIN_GCC32/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN_GCC64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$TOOLCHAIN_GCC32/bin/arm-linux-androideabi-"
          export LOCALVERSION=

          DEFCONFIG="${DEFCONFIG_INPUT}"
          DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"

          if [ ! -f "${DEFCONFIG_PATH}" ]; then
            echo "defconfig 不存在：${DEFCONFIG_PATH}"
            exit 1
          fi

          # 对齐 vendor 模块 vermagic（避免 Wi-Fi 模块加载失败）
          sed -i -E 's/^SUBLEVEL = .*/SUBLEVEL = 117/' Makefile
          sed -i -E 's/^EXTRAVERSION = .*/EXTRAVERSION =/' Makefile
          rm -f .scmversion

          if [ "$WITH_SUKISU" = "on" ]; then
            # non-GKI 使用 manual hook
            sed -i -E '/^CONFIG_KSU=/d' "${DEFCONFIG_PATH}"
            sed -i -E '/^# CONFIG_KSU is not set/d' "${DEFCONFIG_PATH}"
            sed -i -E '/^CONFIG_KSU_MANUAL_HOOK/d' "${DEFCONFIG_PATH}"
            sed -i -E '/^# CONFIG_KSU_MANUAL_HOOK is not set/d' "${DEFCONFIG_PATH}"
            sed -i -E '/^CONFIG_KSU_MANUAL_SU/d' "${DEFCONFIG_PATH}"
            sed -i -E '/^# CONFIG_KSU_MANUAL_SU is not set/d' "${DEFCONFIG_PATH}"
            printf '%s\n' \
              'CONFIG_KSU=y' \
              'CONFIG_KSU_MANUAL_HOOK=y' \
              '# CONFIG_KSU_MANUAL_SU is not set' \
              'CONFIG_KPROBES=y' \
              'CONFIG_KRETPROBES=y' \
              'CONFIG_KPROBE_EVENTS=y' \
              'CONFIG_KALLSYMS=y' \
              'CONFIG_KALLSYMS_ALL=y' \
              'CONFIG_SECURITYFS=y' \
              'CONFIG_DEVTMPFS=y' \
              'CONFIG_DEVTMPFS_MOUNT=y' \
              'CONFIG_OVERLAY_FS=y' \
              >> "${DEFCONFIG_PATH}"
          fi

          mkdir -p out
          make O=out "$DEFCONFIG"

          if [ "$WITH_SUKISU" = "on" ]; then
            # KernelSU：manual hook 路线
            ./scripts/config --file out/.config -e KSU || true
            ./scripts/config --file out/.config -e KSU_MANUAL_HOOK || true
            ./scripts/config --file out/.config -d KSU_MANUAL_SU || true
            ./scripts/config --file out/.config -e KPROBES || true
            ./scripts/config --file out/.config -e KRETPROBES || true
            ./scripts/config --file out/.config -e KPROBE_EVENTS || true
            ./scripts/config --file out/.config -e KALLSYMS || true
            ./scripts/config --file out/.config -e KALLSYMS_ALL || true
            ./scripts/config --file out/.config -e SECURITYFS || true
            ./scripts/config --file out/.config -e DEVTMPFS || true
            ./scripts/config --file out/.config -e DEVTMPFS_MOUNT || true
            ./scripts/config --file out/.config -e OVERLAY_FS || true
          fi

          # 保持 MODULE_SIG 以对齐 struct module，但关闭强制签名校验
          ./scripts/config --file out/.config -e MODULE_SIG || true
          ./scripts/config --file out/.config -d MODULE_SIG_FORCE || true
          ./scripts/config --file out/.config -d MODULE_SIG_ALL || true
          # 保持 MODVERSIONS，与 vendor 模块一致
          ./scripts/config --file out/.config -e MODVERSIONS || true

          # 对齐版本字符串，避免 vermagic 不匹配
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO || true
          ./scripts/config --file out/.config --set-str LOCALVERSION "-perf-g4732215-tanran" || true

          FORTIFY="${FORTIFY_MODE}"
          if [ "$FORTIFY" = "on" ]; then
            ./scripts/config --file out/.config -e FORTIFY_SOURCE || true
          else
            # GCC 4.9 下 include/linux/string.h 的 FORTIFY memcpy 会触发 __read_overflow2 编译期错误
            ./scripts/config --file out/.config -d FORTIFY_SOURCE || true
          fi

          # 避免 Image.gz 触发 dtb 全量编译（dtc 错误会导致构建失败）
          ./scripts/config --file out/.config -d BUILD_ARM64_DTBS || true
          ./scripts/config --file out/.config -d BUILD_ARM64_APPENDED_DTB_IMAGE || true

          make O=out olddefconfig

          if [ "$WITH_SUKISU" = "on" ]; then
            # olddefconfig 后确认 manual hook 仍保持开启
            ./scripts/config --file out/.config -e KSU || true
            ./scripts/config --file out/.config -e KSU_MANUAL_HOOK || true
            ./scripts/config --file out/.config -d KSU_MANUAL_SU || true
            ./scripts/config --file out/.config -e KPROBES || true
            ./scripts/config --file out/.config -e KRETPROBES || true
            ./scripts/config --file out/.config -e KPROBE_EVENTS || true
            ./scripts/config --file out/.config -e KALLSYMS || true
            ./scripts/config --file out/.config -e KALLSYMS_ALL || true
            ./scripts/config --file out/.config -e SECURITYFS || true
            ./scripts/config --file out/.config -e DEVTMPFS || true
            ./scripts/config --file out/.config -e DEVTMPFS_MOUNT || true
            ./scripts/config --file out/.config -e OVERLAY_FS || true

            # 再次确保模块签名/版本字符串设置生效
            ./scripts/config --file out/.config -e MODULE_SIG || true
            ./scripts/config --file out/.config -d MODULE_SIG_FORCE || true
            ./scripts/config --file out/.config -d MODULE_SIG_ALL || true
            ./scripts/config --file out/.config -e MODVERSIONS || true
            ./scripts/config --file out/.config -d LOCALVERSION_AUTO || true
            ./scripts/config --file out/.config --set-str LOCALVERSION "-perf-g4732215-tanran" || true

            make O=out olddefconfig

            if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config; then
              echo "CONFIG_KSU_MANUAL_HOOK 未开启，停止构建"
              exit 1
            fi
          fi

          # 保持默认版本字符串，避免 vendor 模块 vermagic 不匹配（例如 Wi-Fi 驱动）
      - name: 编译
        id: build
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAIN_GCC64/bin:$TOOLCHAIN_GCC32/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN_GCC64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$TOOLCHAIN_GCC32/bin/arm-linux-androideabi-"
          export LOCALVERSION=

          if [ "$BUILD_DTBO" = "on" ]; then
            # dtbo (/plugin/;) 需要 -@ 才能生成符号/修复信息
            make -j"$(nproc)" O=out Image.gz-dtb V=1 DTC_FLAGS="-@" \
              CC="${CROSS_COMPILE}gcc" 2>&1 | tee build.log
          else
            # 先确保能编译出内核镜像；dtbo 问题后续再单独修
            make -j"$(nproc)" O=out Image.gz V=1 \
              CC="${CROSS_COMPILE}gcc" 2>&1 | tee build.log

            mkdir -p dist
            rm -f dist/dtb

            STOCK_DTB_B64="ci_assets/laurus_q_dtb.bin.gz.b64"
            if [ -f "${STOCK_DTB_B64}" ]; then
              # 优先使用 stock dtb blob，避免 trinket dtb 编译失败
              if gzip -t "${STOCK_DTB_B64}" >/dev/null 2>&1; then
                gzip -dc "${STOCK_DTB_B64}" > dist/dtb
              else
                base64 -d "${STOCK_DTB_B64}" | gzip -d > dist/dtb
              fi
            else
              # 编译 trinket 相关 dtb（失败跳过，后续按 size 白名单拼接）
              set +e
              for dts in $(find arch/arm64/boot/dts/qcom -maxdepth 1 -name 'trinket*.dts' ! -name '*-overlay.dts' -print | sort); do
                dtb="$(basename "${dts%.dts}.dtb")"
                if make -j"$(nproc)" O=out "qcom/${dtb}" V=1 2>&1 | tee -a build.log; then
                  echo "built dtb: ${dtb}" | tee -a build.log
                else
                  echo "skip dtb build failed: ${dtb}" | tee -a build.log
                fi
              done
              set -e

              # 根据 stock dtb 的 size 列表重建 dtb blob（Q 版本）
              STOCK_DTB_SIZES=("54743" "33269" "4065" "46749" "5306" "4753" "27379" "327570")
              tmp_map="$(mktemp)"
              find out/arch/arm64/boot/dts/qcom -maxdepth 1 -name 'trinket*.dtb' -print0 | xargs -0 -I{} stat -c '%s %n' {} | sort > "${tmp_map}"

              : > dist/dtb
              for size in "${STOCK_DTB_SIZES[@]}"; do
                match="$(awk -v s="${size}" '$1==s{print $2; exit}' "${tmp_map}")"
                if [ -z "${match}" ]; then
                  echo "missing dtb size: ${size}" | tee -a build.log
                  exit 1
                fi
                cat "${match}" >> dist/dtb
              done
              rm -f "${tmp_map}"
            fi

            # 生成 CC 9e/Trinket 多 DTB Image.gz-dtb（直接用于打包/刷机）
            cat out/arch/arm64/boot/Image.gz dist/dtb > dist/Image.gz-dtb
          fi

      - name: 打包 AnyKernel3（可直接刷）
        id: package
        if: steps.build.outcome == 'success'
        run: |
          set -euxo pipefail
          mkdir -p dist

          # build_dtbo=on 时，尝试复用 out 里生成的 Image.gz-dtb
          if [ ! -f dist/Image.gz-dtb ] && [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp -f out/arch/arm64/boot/Image.gz-dtb dist/Image.gz-dtb
          fi

          test -f dist/Image.gz-dtb

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel3
          cp -f dist/Image.gz-dtb anykernel3/Image.gz-dtb

          # 仅做最小定制：限制设备代号（CC 9e=laurus；同平台 Mi A3=laurel_sprout）
          sed -i \
            -e 's/^do.devicecheck=.*/do.devicecheck=1/' \
            -e 's/^device.name1=.*/device.name1=laurus/' \
            -e 's/^device.name2=.*/device.name2=laurel_sprout/' \
            anykernel3/anykernel.sh || true

          (cd anykernel3 && zip -r9 ../dist/AnyKernel3-laurus-${RUN_ID}.zip . -x '.git/*')

      - name: 生成 boot.img（可 fastboot 刷入）
        id: bootimg
        if: steps.build.outcome == 'success'
        run: |
          set -euxo pipefail
          mkdir -p dist
          test -f out/arch/arm64/boot/Image.gz

          rm -rf repack
          mkdir -p repack/out
          cp -f out/arch/arm64/boot/Image.gz repack/out/kernel
          : > repack/out/ramdisk

          test -f dist/dtb
          cp -f dist/dtb repack/out/dtb
          ls -lh dist/dtb repack/out/dtb

          # 使用仓库自带 mkbootimg.py 生成 boot.img
          test -f tools/mkbootimg.py

          CMDLINE="console=ttyMSM0,115200n8 androidboot.hardware=qcom androidboot.console=ttyMSM0 androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 swiotlb=1 earlycon=msm_geni_serial,0x4a90000 loop.max_part=7 cgroup.memory=nokmem,nosocket androidboot.selinux=enforcing buildvariant=user"

          (cd repack && python3 ../tools/mkbootimg.py \
            --header_version 2 \
            --os_version 10.0.0 \
            --os_patch_level 2021-09 \
            --kernel out/kernel \
            --ramdisk out/ramdisk \
            --dtb out/dtb \
            --pagesize 0x00001000 \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --second_offset 0x00f00000 \
            --tags_offset 0x00000100 \
            --dtb_offset 0x0000000001f00000 \
            --board "" \
            --cmdline "$CMDLINE" \
            -o ../dist/boot.img)

          # laurus boot 分区固定 64MB，做一次 truncate 与 stock 对齐
          truncate -s 64M dist/boot.img
          ls -lh dist/boot.img

      - name: 写入精简日志（方便无鉴权查看）
        if: always()
        env:
          STEP_CHECKOUT: ${{ steps.checkout.outcome }}
          STEP_DEPS: ${{ steps.deps.outcome }}
          STEP_TOOLCHAIN: ${{ steps.toolchain.outcome }}
          STEP_SUKISU: ${{ steps.sukisu.outcome }}
          STEP_CONFIG: ${{ steps.config.outcome }}
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_PACKAGE: ${{ steps.package.outcome }}
        run: |
          set -euxo pipefail
          mkdir -p ci_logs
          outfile="ci_logs/${RUN_ID}.txt"
          {
            echo "run_id=${RUN_ID}"
            echo "head_sha=${HEAD_SHA}"
            echo "kernel_ref=${KERNEL_BRANCH}"
            echo "defconfig=${DEFCONFIG_INPUT}"
            echo "fortify=${FORTIFY_MODE}"
            echo "build_dtbo=${BUILD_DTBO}"
            echo "with_sukisu=${WITH_SUKISU}"
            echo
            echo "==== step outcomes ===="
            echo "checkout=${STEP_CHECKOUT}"
            echo "deps=${STEP_DEPS}"
            echo "toolchain=${STEP_TOOLCHAIN}"
            echo "sukisu=${STEP_SUKISU}"
            echo "config=${STEP_CONFIG}"
            echo "build=${STEP_BUILD}"
            echo "package=${STEP_PACKAGE}"
            echo
            echo "==== ksu config snapshot (out/.config) ===="
            if [ -f out/.config ]; then
              grep -nE "KSU|KPM|SUSFS|KPROBES|KRETPROBES|KPROBES_ON_FTRACE|KPROBE_EVENTS|KALLSYMS|FTRACE" out/.config 2>&1 | head -n 200 || true
            else
              echo "out/.config not found"
            fi
            echo
            echo "==== artifacts existence ===="
            ls -l build.log 2>&1 || true
            ls -l out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/trinket.dtb 2>&1 || true
            ls -l dist/Image.gz-dtb dist/AnyKernel3-laurus-${RUN_ID}.zip dist/boot.img 2>&1 || true
            echo
            echo "==== build.log errors (tail 200) ===="
            grep -nE "error:|fatal error:" build.log 2>&1 | tail -n 200 || true
            echo
            echo "==== make failures (tail 120) ===="
            grep -nE "make(\[[0-9]+\])?: \*\*\*|make: \*\*\*|Error [0-9]+" build.log 2>&1 | tail -n 120 || true
            echo
            echo "==== dtc/dts errors (tail 200) ===="
            grep -nE "FATAL ERROR|syntax error|parse error|Error:" build.log 2>&1 | tail -n 200 || true
            echo
            echo "==== forbidden warnings (tail 80) ===="
            grep -n "warn, forbidden warning" build.log 2>&1 | tail -n 80 || true
            echo
            echo "==== bad_copy / fortify hits (head 200) ===="
            grep -nE "__bad_copy_(to|from)|copy (source|destination) size is too small|__compiletime_error\(\"copy (source|destination) size is too small\"\)|__read_overflow2|FORTIFY|__check_object_size" build.log 2>&1 | head -n 200 || true
            echo
            echo "==== bad_copy context (first 3 hits, each +/-60 lines) ===="
            hits="$(grep -nE "__bad_copy_(to|from)" build.log 2>/dev/null | head -n 3 | cut -d: -f1 | tr '\n' ' ' || true)"
            if [ -n "${hits}" ]; then
              for n in ${hits}; do
                start=$((n-60)); end=$((n+60)); if [ "$start" -lt 1 ]; then start=1; fi
                echo "--- context around build.log:$n (lines $start-$end) ---"
                sed -n "${start},${end}p" build.log 2>&1 || true
                echo
              done
            else
              echo "(no __bad_copy_* strings found in build.log)"
            fi
            echo
            echo "==== tail build.log (last 1200) ===="
            tail -n 1200 build.log 2>&1 || true
          } > "$outfile"

          cp -f "$outfile" ci_logs/latest.txt
          echo "Wrote $outfile"

      - name: 上传产物（无论成功失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laurus-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            build.log
            ci_logs/latest.txt
            out/.config
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/qcom/trinket.dtb
            dist/Image.gz-dtb
            dist/AnyKernel3-laurus-${RUN_ID}.zip
            dist/boot.img
