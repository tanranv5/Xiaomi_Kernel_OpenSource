name: build-laurus-sukisu

"on":
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "要编译的内核分支"
        required: true
        default: "laurus-p-oss-ci"
      defconfig:
        description: "defconfig（相对 arch/arm64/configs/）"
        required: true
        default: "vendor/laurus-perf_defconfig"
      sukisu_ref:
        description: "SukiSU Ultra 引用（分支/标签/commit）"
        required: true
        default: "main"
      sukisu_mode:
        description: "SukiSU 集成模式：builtin 更适合非 GKI/老内核"
        required: true
        default: "builtin"
        type: choice
        options:
          - builtin
          - main
      fortify:
        description: "是否启用 FORTIFY_SOURCE（推荐日用 on；老 GCC 4.9 需先修触发点再开启）"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      build_dtbo:
        description: "是否构建 DTBO（overlay）；off 会绕过 trinket dtbo 编译失败（先确保内核能出镜像）"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      gcc64_repo:
        description: "AArch64 GCC 4.9 工具链仓库"
        required: true
        default: "LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9"
      gcc64_ref:
        description: "AArch64 GCC 4.9 工具链分支"
        required: true
        default: "lineage-19.1"
      gcc32_repo:
        description: "ARM GCC 4.9 工具链仓库"
        required: true
        default: "LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9"
      gcc32_ref:
        description: "ARM GCC 4.9 工具链分支"
        required: true
        default: "lineage-19.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      WITH_SUKISU: "on"

    steps:
      - name: 检出内核源码
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.kernel_branch || 'laurus-p-oss-ci' }}

      - name: 安装依赖
        id: deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates \
            flex git libelf-dev libssl-dev \
            python3 rsync unzip xz-utils \
            device-tree-compiler zip

      - name: 应用 SukiSU manual hook 补丁（4.14）
        id: manual-hook
        if: env.WITH_SUKISU == 'on'
        run: |
          set -euxo pipefail
          cat <<'PATCH' > /tmp/ksu-manual.patch
          diff --git a/drivers/input/input.c b/drivers/input/input.c
          index c5c301d0956b..4f233f1560f3 100644
          --- a/drivers/input/input.c
          +++ b/drivers/input/input.c
          @@ -377,11 +377,18 @@ static int input_get_disposition(struct input_dev *dev,
          \treturn disposition;
          }
          
          +#ifdef CONFIG_KSU
          +extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          +#endif
           static void input_handle_event(struct input_dev *dev,
          \t\t\t       unsigned int type, unsigned int code, int value)
           {
          \tint disposition = input_get_disposition(dev, type, code, &value);
          
          +#ifdef CONFIG_KSU
          +\tksu_handle_input_handle_event(&type, &code, &value);
          +#endif
          \tif (disposition != INPUT_IGNORE_EVENT && type != EV_SYN)
          \t\tadd_input_randomness(type, code, value);
          
          diff --git a/fs/exec.c b/fs/exec.c
          index d98e7ce04dbd..c0cc201ca3b6 100644
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -1713,6 +1713,13 @@ static int exec_binprm(struct linux_binprm *bprm)
           /*
            * sys_execve() executes a new program.
            */
          +#ifdef CONFIG_KSU
          +extern int ksu_handle_execveat_ksud(int *fd, struct filename **filename_ptr,
          +\t\t\tstruct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags);
          +extern int ksu_handle_execve_sucompat(const char __user **filename_user,
          +\t\t\tvoid *__never_use_argv, void *__never_use_envp, int *__never_use_flags);
          +#endif
           static int do_execveat_common(int fd, struct filename *filename,
          \t\t\t      struct user_arg_ptr argv,
          \t\t\t      struct user_arg_ptr envp,
          @@ -1724,6 +1731,10 @@ static int do_execveat_common(int fd, struct filename *filename,
          \tstruct files_struct *displaced;
          \tint retval;
          
          \tif (IS_ERR(filename))
          \t\treturn PTR_ERR(filename);
          
          +#ifdef CONFIG_KSU
          +\tksu_handle_execveat_ksud(&fd, &filename, &argv, &envp, &flags);
          +#endif
          \t/*
          \t * We move the actual failure in case of RLIMIT_NPROC excess from
          \t * set*uid() to execve() because too many poorly written programs
          @@ -1943,6 +1954,9 @@ SYSCALL_DEFINE3(execve,
          \t\tconst char __user *, filename,
          \t\tconst char __user *const __user *, argv,
          \t\tconst char __user *const __user *, envp)
           {
          +#ifdef CONFIG_KSU
          +\tksu_handle_execve_sucompat(&filename, NULL, NULL, NULL);
          +#endif
          \treturn do_execve(getname(filename), argv, envp);
           }
          
          @@ -1955,6 +1969,9 @@ SYSCALL_DEFINE5(execveat,
          \t\tint, flags)
           {
          \tint lookup_flags = (flags & AT_EMPTY_PATH) ? LOOKUP_EMPTY : 0;
          
          +#ifdef CONFIG_KSU
          +\tksu_handle_execve_sucompat(&filename, NULL, NULL, NULL);
          +#endif
          \treturn do_execveat(fd,
          \t\t\t   getname_flags(filename, lookup_flags, NULL),
          \t\t\t   argv, envp, flags);
          diff --git a/fs/open.c b/fs/open.c
          index 548494f1277c..26def41eeca5 100644
          --- a/fs/open.c
          +++ b/fs/open.c
          @@ -359,6 +359,10 @@ SYSCALL_DEFINE4(fallocate, int, fd, int, mode, loff_t, offset, loff_t, len)
           * We do this by temporarily clearing all FS-related capabilities and
           * switching the fsuid/fsgid around to the real ones.
           */
          +#ifdef CONFIG_KSU
          +extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,
          +\t\t\t int *flags);
          +#endif
           SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
           {
          \tconst struct cred *old_cred;
          @@ -369,6 +373,10 @@ SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          \tint res;
          \tunsigned int lookup_flags = LOOKUP_FOLLOW;
          
          +#ifdef CONFIG_KSU
          +\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          +#endif
          \tif (mode & ~S_IRWXO)\t/* where's F_OK, X_OK, W_OK, R_OK? */
          \t\treturn -EINVAL;
          
          diff --git a/fs/stat.c b/fs/stat.c
          index 0fda4b6b8fb2..7423c5eeac9a 100644
          --- a/fs/stat.c
          +++ b/fs/stat.c
          @@ -163,6 +163,9 @@ EXPORT_SYMBOL(vfs_statx_fd);
           *
           * 0 will be returned on success, and a -ve error code if unsuccessful.
           */
          +#ifdef CONFIG_KSU
          +extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          +#endif
           int vfs_statx(int dfd, const char __user *filename, int flags,
          \t      struct kstat *stat, u32 request_mask)
           {
          @@ -170,6 +173,10 @@ int vfs_statx(int dfd, const char __user *filename, int flags,
          \tint error = -EINVAL;
          \tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;
          
          +#ifdef CONFIG_KSU
          +\tksu_handle_stat(&dfd, &filename, &flags);
          +#endif
          \tif ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |
          \t\t       AT_EMPTY_PATH | KSTAT_QUERY_FLAGS)) != 0)
          \t\treturn -EINVAL;
          diff --git a/kernel/reboot.c b/kernel/reboot.c
          index 2946ed1d99d4..253b81f76325 100644
          --- a/kernel/reboot.c
          +++ b/kernel/reboot.c
          @@ -277,6 +277,9 @@ static DEFINE_MUTEX(reboot_mutex);
           *
           * reboot doesn't sync: do that yourself before calling this.
           */
          +#ifdef CONFIG_KSU
          +extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
          +#endif
           SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          \t\tvoid __user *, arg)
           {
          @@ -284,6 +287,10 @@ SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          \tchar buffer[256];
          \tint ret = 0;
          
          +#ifdef CONFIG_KSU
          +\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          +#endif
          \t/* We only trust the superuser with rebooting the system. */
          \tif (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))
          \t\treturn -EPERM;
          PATCH
          sed $'s/\\t/\t/g' /tmp/ksu-manual.patch > /tmp/ksu-manual.patch.fixed
          mv /tmp/ksu-manual.patch.fixed /tmp/ksu-manual.patch
          git apply /tmp/ksu-manual.patch

      - name: 拉取工具链（GCC 4.9）
        id: toolchain
        run: |
          set -euxo pipefail
          GCC64_REPO="${{ github.event_name == 'workflow_dispatch' && inputs.gcc64_repo || 'LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9' }}"
          GCC64_REF="${{ github.event_name == 'workflow_dispatch' && inputs.gcc64_ref || 'lineage-19.1' }}"
          GCC32_REPO="${{ github.event_name == 'workflow_dispatch' && inputs.gcc32_repo || 'LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9' }}"
          GCC32_REF="${{ github.event_name == 'workflow_dispatch' && inputs.gcc32_ref || 'lineage-19.1' }}"

          git clone --depth=1 -b "$GCC64_REF" "https://github.com/${GCC64_REPO}.git" toolchain-gcc64
          git clone --depth=1 -b "$GCC32_REF" "https://github.com/${GCC32_REPO}.git" toolchain-gcc32

          echo "TOOLCHAIN_GCC64=$PWD/toolchain-gcc64" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_GCC32=$PWD/toolchain-gcc32" >> "$GITHUB_ENV"

      - name: 集成 SukiSU Ultra
        id: sukisu
        run: |
          set -euxo pipefail
          if [ "${WITH_SUKISU}" != "on" ]; then
            echo "WITH_SUKISU=${WITH_SUKISU}, skip SukiSU integrate."
            exit 0
          fi

          ref="${{ github.event_name == 'workflow_dispatch' && inputs.sukisu_ref || 'main' }}"
          mode="${{ github.event_name == 'workflow_dispatch' && inputs.sukisu_mode || 'builtin' }}"

          # SukiSU 官方脚本
          curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${ref}/kernel/setup.sh" | bash -s "$mode"

      - name: 配置 defconfig
        id: config
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAIN_GCC64/bin:$TOOLCHAIN_GCC32/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN_GCC64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$TOOLCHAIN_GCC32/bin/arm-linux-androideabi-"

          DEFCONFIG="${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'vendor/laurus-perf_defconfig' }}"
          DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"

          if [ ! -f "${DEFCONFIG_PATH}" ]; then
            echo "defconfig 不存在：${DEFCONFIG_PATH}"
            exit 1
          fi

          if [ "$WITH_SUKISU" = "on" ]; then
            # 明确写入关键依赖（对老内核更稳），避免 olddefconfig 回落
            printf '%s\n' \
              'CONFIG_KPROBES=y' \
              'CONFIG_KRETPROBES=y' \
              'CONFIG_KPROBE_EVENTS=y' \
              'CONFIG_KALLSYMS=y' \
              'CONFIG_KALLSYMS_ALL=y' \
              'CONFIG_KSU_MANUAL_HOOK=y' \
              'CONFIG_KSU_MANUAL_SU=y' \
              >> "${DEFCONFIG_PATH}"
          fi

          mkdir -p out
          make O=out "$DEFCONFIG"

          if [ "$WITH_SUKISU" = "on" ]; then
            # KernelSU：保持默认配置，确保 hook 依赖项开启
            ./scripts/config --file out/.config -e KSU || true
            ./scripts/config --file out/.config -e KPROBES || true
            ./scripts/config --file out/.config -e KRETPROBES || true
            ./scripts/config --file out/.config -e KPROBES_ON_FTRACE || true
            ./scripts/config --file out/.config -e KPROBE_EVENTS || true
            ./scripts/config --file out/.config -e KALLSYMS || true
            ./scripts/config --file out/.config -e KALLSYMS_ALL || true
            ./scripts/config --file out/.config -e KSU_MANUAL_HOOK || true
            ./scripts/config --file out/.config -e KSU_MANUAL_SU || true
          fi

          FORTIFY="${{ github.event_name == 'workflow_dispatch' && inputs.fortify || 'off' }}"
          if [ "$FORTIFY" = "on" ]; then
            ./scripts/config --file out/.config -e FORTIFY_SOURCE || true
          else
            # GCC 4.9 下 include/linux/string.h 的 FORTIFY memcpy 会触发 __read_overflow2 编译期错误
            ./scripts/config --file out/.config -d FORTIFY_SOURCE || true
          fi

          make O=out olddefconfig

          if [ "$WITH_SUKISU" = "on" ]; then
            # olddefconfig 后再确认 hook 依赖项保持开启
            ./scripts/config --file out/.config -e KPROBES || true
            ./scripts/config --file out/.config -e KRETPROBES || true
            ./scripts/config --file out/.config -e KPROBES_ON_FTRACE || true
            ./scripts/config --file out/.config -e KPROBE_EVENTS || true
            ./scripts/config --file out/.config -e KALLSYMS || true
            ./scripts/config --file out/.config -e KALLSYMS_ALL || true
            ./scripts/config --file out/.config -e KSU_MANUAL_HOOK || true
            ./scripts/config --file out/.config -e KSU_MANUAL_SU || true
          fi

          # 内核版本标记：添加 -tanran 后缀，便于识别修过的内核
          ./scripts/config --file out/.config --set-str LOCALVERSION "-tanran" || true
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO || true
      - name: 编译
        id: build
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAIN_GCC64/bin:$TOOLCHAIN_GCC32/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN_GCC64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$TOOLCHAIN_GCC32/bin/arm-linux-androideabi-"

          BUILD_DTBO="${{ github.event_name == 'workflow_dispatch' && inputs.build_dtbo || 'off' }}"

          if [ "$BUILD_DTBO" = "on" ]; then
            # dtbo (/plugin/;) 需要 -@ 才能生成符号/修复信息
            make -j"$(nproc)" O=out Image.gz-dtb V=1 DTC_FLAGS="-@" 2>&1 | tee build.log
          else
            # 先确保能编译出内核镜像；dtbo 问题后续再单独修
            make -j"$(nproc)" O=out Image.gz V=1 2>&1 | tee build.log

            # 注意：arch/arm64/Makefile 的 %.dtb 目标要求传入“相对 dts 根目录”的路径
            make -j"$(nproc)" O=out qcom/trinket.dtb V=1 2>&1 | tee -a build.log

            # 生成 CC 9e/Trinket 专用 Image.gz-dtb（直接用于打包/刷机）
            mkdir -p dist
            cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/trinket.dtb > dist/Image.gz-dtb
          fi

      - name: 打包 AnyKernel3（可直接刷）
        id: package
        if: steps.build.outcome == 'success'
        run: |
          set -euxo pipefail
          mkdir -p dist

          # build_dtbo=on 时，尝试复用 out 里生成的 Image.gz-dtb
          if [ ! -f dist/Image.gz-dtb ] && [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp -f out/arch/arm64/boot/Image.gz-dtb dist/Image.gz-dtb
          fi

          test -f dist/Image.gz-dtb

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel3
          cp -f dist/Image.gz-dtb anykernel3/Image.gz-dtb

          # 仅做最小定制：限制设备代号（CC 9e=laurus；同平台 Mi A3=laurel_sprout）
          sed -i \
            -e 's/^do.devicecheck=.*/do.devicecheck=1/' \
            -e 's/^device.name1=.*/device.name1=laurus/' \
            -e 's/^device.name2=.*/device.name2=laurel_sprout/' \
            anykernel3/anykernel.sh || true

          (cd anykernel3 && zip -r9 ../dist/AnyKernel3-laurus-${{ github.run_id }}.zip . -x '.git/*')

      - name: 写入精简日志（方便无鉴权查看）
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p ci_logs
          outfile="ci_logs/${{ github.run_id }}.txt"
          {
            echo "run_id=${{ github.run_id }}"
            echo "head_sha=${{ github.sha }}"
            echo "kernel_ref=${{ github.event_name == 'workflow_dispatch' && inputs.kernel_branch || 'laurus-p-oss-ci' }}"
            echo "defconfig=${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'vendor/laurus-perf_defconfig' }}"
            echo "fortify=${{ github.event_name == 'workflow_dispatch' && inputs.fortify || 'off' }}"
            echo "build_dtbo=${{ github.event_name == 'workflow_dispatch' && inputs.build_dtbo || 'off' }}"
            echo "with_sukisu=${WITH_SUKISU}"
            echo
            echo "==== step outcomes ===="
            echo "checkout=${{ steps.checkout.outcome }}"
            echo "deps=${{ steps.deps.outcome }}"
            echo "toolchain=${{ steps.toolchain.outcome }}"
            echo "sukisu=${{ steps.sukisu.outcome }}"
            echo "config=${{ steps.config.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "package=${{ steps.package.outcome }}"
            echo
            echo "==== ksu config snapshot (out/.config) ===="
            if [ -f out/.config ]; then
              grep -nE "KSU|KPROBES|KRETPROBES|KPROBES_ON_FTRACE|KPROBE_EVENTS|KALLSYMS|FTRACE" out/.config 2>&1 | head -n 200 || true
            else
              echo "out/.config not found"
            fi
            echo
            echo "==== artifacts existence ===="
            ls -l build.log 2>&1 || true
            ls -l out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/trinket.dtb 2>&1 || true
            ls -l dist/Image.gz-dtb dist/AnyKernel3-laurus-${{ github.run_id }}.zip 2>&1 || true
            echo
            echo "==== build.log errors (tail 200) ===="
            grep -nE "error:|fatal error:" build.log 2>&1 | tail -n 200 || true
            echo
            echo "==== make failures (tail 120) ===="
            grep -nE "make(\[[0-9]+\])?: \*\*\*|make: \*\*\*|Error [0-9]+" build.log 2>&1 | tail -n 120 || true
            echo
            echo "==== dtc/dts errors (tail 200) ===="
            grep -nE "FATAL ERROR|syntax error|parse error|Error:" build.log 2>&1 | tail -n 200 || true
            echo
            echo "==== forbidden warnings (tail 80) ===="
            grep -n "warn, forbidden warning" build.log 2>&1 | tail -n 80 || true
            echo
            echo "==== bad_copy / fortify hits (head 200) ===="
            grep -nE "__bad_copy_(to|from)|copy (source|destination) size is too small|__compiletime_error\\(\"copy (source|destination) size is too small\"\\)|__read_overflow2|FORTIFY|__check_object_size" build.log 2>&1 | head -n 200 || true
            echo
            echo "==== bad_copy context (first 3 hits, each +/-60 lines) ===="
            hits="$(grep -nE "__bad_copy_(to|from)" build.log 2>/dev/null | head -n 3 | cut -d: -f1 | tr '\n' ' ' || true)"
            if [ -n "${hits}" ]; then
              for n in ${hits}; do
                start=$((n-60)); end=$((n+60)); if [ "$start" -lt 1 ]; then start=1; fi
                echo "--- context around build.log:$n (lines $start-$end) ---"
                sed -n "${start},${end}p" build.log 2>&1 || true
                echo
              done
            else
              echo "(no __bad_copy_* strings found in build.log)"
            fi
            echo
            echo "==== tail build.log (last 1200) ===="
            tail -n 1200 build.log 2>&1 || true
          } > "$outfile"

          cp -f "$outfile" ci_logs/latest.txt
          echo "Wrote $outfile"

      - name: 上传产物（无论成功失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laurus-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            build.log
            out/.config
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/qcom/trinket.dtb
            dist/Image.gz-dtb
            dist/AnyKernel3-laurus-${{ github.run_id }}.zip
            ci_logs/${{ github.run_id }}.txt
            ci_logs/latest.txt
