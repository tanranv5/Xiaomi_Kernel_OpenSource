name: build-laurus-sukisu

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "要编译的内核分支"
        required: true
        default: "laurus-q-oss-ci"
      defconfig:
        description: "defconfig（相对 arch/arm64/configs/）"
        required: true
        default: "vendor/laurus-perf_defconfig"
      sukisu_ref:
        description: "SukiSU Ultra 引用（分支/标签/commit）"
        required: true
        default: "main"
      sukisu_mode:
        description: "SukiSU 集成模式：builtin 更适合非 GKI/老内核"
        required: true
        default: "builtin"
        type: choice
        options:
          - builtin
          - main
      fortify:
        description: "是否启用 FORTIFY_SOURCE（推荐日用 on；老 GCC 4.9 需先修触发点再开启）"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      build_dtbo:
        description: "是否构建 DTBO（overlay）；off 会绕过 trinket dtbo 编译失败（先确保内核能出镜像）"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      gcc64_repo:
        description: "AArch64 GCC 4.9 工具链仓库"
        required: true
        default: "LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9"
      gcc64_ref:
        description: "AArch64 GCC 4.9 工具链分支"
        required: true
        default: "lineage-19.1"
      gcc32_repo:
        description: "ARM GCC 4.9 工具链仓库"
        required: true
        default: "LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9"
      gcc32_ref:
        description: "ARM GCC 4.9 工具链分支"
        required: true
        default: "lineage-19.1"
  push:
    branches:
      - laurus-p-oss-ci-ksu-kprobe-fallback

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      WITH_SUKISU: "on"

    steps:
      - name: 检出内核源码
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.kernel_branch || 'laurus-q-oss-ci' }}

      - name: 安装依赖
        id: deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates \
            curl flex git libelf-dev libssl-dev \
            python3 rsync unzip xz-utils \
            device-tree-compiler zip

      - name: 拉取工具链（GCC 4.9）
        id: toolchain
        run: |
          set -euxo pipefail
          GCC64_REPO="${{ github.event_name == 'workflow_dispatch' && inputs.gcc64_repo || 'LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9' }}"
          GCC64_REF="${{ github.event_name == 'workflow_dispatch' && inputs.gcc64_ref || 'lineage-19.1' }}"
          GCC32_REPO="${{ github.event_name == 'workflow_dispatch' && inputs.gcc32_repo || 'LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9' }}"
          GCC32_REF="${{ github.event_name == 'workflow_dispatch' && inputs.gcc32_ref || 'lineage-19.1' }}"

          git clone --depth=1 -b "$GCC64_REF" "https://github.com/${GCC64_REPO}.git" toolchain-gcc64
          git clone --depth=1 -b "$GCC32_REF" "https://github.com/${GCC32_REPO}.git" toolchain-gcc32

          echo "TOOLCHAIN_GCC64=$PWD/toolchain-gcc64" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_GCC32=$PWD/toolchain-gcc32" >> "$GITHUB_ENV"

      - name: 集成 SukiSU Ultra
        id: sukisu
        run: |
          set -euxo pipefail
          if [ "${WITH_SUKISU}" != "on" ]; then
            echo "WITH_SUKISU=${WITH_SUKISU}, skip SukiSU integrate."
            exit 0
          fi

          ref="${{ github.event_name == 'workflow_dispatch' && inputs.sukisu_ref || 'main' }}"
          mode="${{ github.event_name == 'workflow_dispatch' && inputs.sukisu_mode || 'builtin' }}"

          # SukiSU 官方脚本
          curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${ref}/kernel/setup.sh" | bash -s "$mode"

      - name: 修补 KSU manual hook 调用点（4.14）
        id: ksu_manual_hook
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def insert_before(text: str, anchor: str, block: str):
              if block.strip() in text:
                  return text, False
              idx = text.find(anchor)
              if idx < 0:
                  return text, False
              return text[:idx] + block + text[idx:], True

          def insert_after_first(text: str, anchor: str, block: str):
              if block.strip() in text:
                  return text, False
              idx = text.find(anchor)
              if idx < 0:
                  return text, False
              pos = idx + len(anchor)
              return text[:pos] + block + text[pos:], True

          def insert_exec_hook(text: str, func_anchor: str, block: str):
              if block.strip() in text:
                  return text, False
              fidx = text.find(func_anchor)
              if fidx < 0:
                  return text, False
              bidx = text.find("{", fidx)
              if bidx < 0:
                  return text, False
              ridx = text.find("\tint retval;\n", bidx)
              if ridx < 0:
                  return text, False
              pos = ridx + len("\tint retval;\n")
              return text[:pos] + block + text[pos:], True

          rw = Path("fs/read_write.c")
          rw_text = rw.read_text()
          rw_decl = (
              "#ifdef CONFIG_KSU\n"
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
              "extern bool ksu_init_rc_hook __read_mostly;\n"
              "extern void ksu_handle_sys_read(unsigned int fd);\n"
              "#endif\n"
              "#endif\n"
          )
          rw_anchor = "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n{\n"
          rw_text, rw_decl_ok = insert_before(rw_text, rw_anchor, rw_decl)
          rw_hook = (
              "\n#ifdef CONFIG_KSU\n"
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
              "\tif (unlikely(ksu_init_rc_hook))\n"
              "\t\tksu_handle_sys_read(fd);\n"
              "#endif\n"
              "#endif\n"
          )
          rw_text, rw_hook_ok = insert_after_first(rw_text, "\tssize_t ret = -EBADF;\n", rw_hook)
          rw.write_text(rw_text)
          print(f"read_write.c patched: decl={rw_decl_ok}, hook={rw_hook_ok}")

          ex = Path("fs/exec.c")
          ex_text = ex.read_text()
          ex_decl = (
              "#ifdef CONFIG_KSU\n"
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
              "extern bool ksu_execveat_hook __read_mostly;\n"
              "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,\n"
              "\t\t\tvoid *envp, int *flags);\n"
              "extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,\n"
              "\t\t\t\t void *argv, void *envp, int *flags);\n"
              "#endif\n"
              "#endif\n"
          )
          ex_anchor = "static int do_execveat_common(int fd, struct filename *filename,\n"
          ex_text, ex_decl_ok = insert_before(ex_text, ex_anchor, ex_decl)
          ex_hook = (
              "\n#ifdef CONFIG_KSU\n"
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
              "\tif (unlikely(ksu_execveat_hook))\n"
              "\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
              "\telse\n"
              "\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n"
              "#endif\n"
              "#endif\n"
          )
          ex_text, ex_hook_ok = insert_exec_hook(ex_text, ex_anchor, ex_hook)
          ex.write_text(ex_text)
          print(f"exec.c patched: decl={ex_decl_ok}, hook={ex_hook_ok}")
          PY

          echo "manual hook callsite check:"
          grep -nE "ksu_handle_sys_read|ksu_init_rc_hook" fs/read_write.c | head -n 20 || true
          grep -nE "ksu_handle_execveat|ksu_execveat_hook" fs/exec.c | head -n 20 || true

      - name: 修补 KSU kprobe 符号回退
        id: ksu_kprobe_fallback
        run: |
          set -euxo pipefail
          ksu_dirs=()
          add_ksu_dir() {
            local d="$1"
            if [ -f "${d}/ksud.c" ]; then
              local real
              real="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "${d}")"
              for e in "${ksu_dirs[@]:-}"; do
                if [ "${e}" = "${real}" ]; then
                  return
                fi
              done
              ksu_dirs+=("${real}")
            fi
          }

          add_ksu_dir "KernelSU/kernel"
          add_ksu_dir "drivers/kernelsu"
          add_ksu_dir "common/drivers/kernelsu"
          if [ -L "drivers/kernelsu" ]; then
            add_ksu_dir "drivers/kernelsu"
          fi

          if [ "${#ksu_dirs[@]}" -eq 0 ]; then
            echo "ksu source dir not found"
            exit 1
          fi

          echo "ksu candidate dirs:"
          printf ' - %s\n' "${ksu_dirs[@]}"

          for ksu_dir in "${ksu_dirs[@]}"; do
          python3 - "$ksu_dir" <<'PY'
          import re
          import sys
          from pathlib import Path

          base = Path(sys.argv[1])
          ksud = base / "ksud.c"
          supercalls = base / "supercalls.c"
          if not ksud.exists():
            print(f"skip: {ksud} not found")
            raise SystemExit(0)

          def ensure_include(text, header):
            if header in text:
              return text
            lines = text.splitlines()
            insert_at = None
            for i, line in enumerate(lines):
              if line.strip().startswith("#include"):
                insert_at = i + 1
              if line.strip() == "#include <linux/fs.h>":
                insert_at = i + 1
            if insert_at is None:
              insert_at = 0
            lines.insert(insert_at, header)
            return "\n".join(lines) + "\n"

          def insert_after_anchor(text, anchor, block):
            if block.strip() in text:
              return text
            idx = text.find(anchor)
            if idx == -1:
              return text
            tail = text[idx:]
            end = tail.find("};")
            if end == -1:
              return text
            insert_pos = idx + end + 2
            return text[:insert_pos] + "\n\n" + block.rstrip() + "\n" + text[insert_pos:]

          def replace_call(text, pattern, replacement):
            if re.search(pattern, text):
              return re.sub(pattern, replacement, text, count=1)
            return text

          ksud_text = ksud.read_text()
          ksud_text = ensure_include(ksud_text, "#include <linux/kernel.h>")
          ksud_text = ensure_include(ksud_text, "#include <linux/proc_fs.h>")
          ksud_text = ensure_include(ksud_text, "#include <linux/seq_file.h>")
          ksud_text = ensure_include(ksud_text, "#include <linux/module.h>")

          ksu_debug_block = """
          static int ksu_execve_kp_ret = -999;
          static int ksu_sys_read_kp_ret = -999;
          static int ksu_sys_fstat_kp_ret = -999;
          static int ksu_input_kp_ret = -999;
          static int ksu_init_rc_seen = 0;
          static char ksu_last_rc_path[256];

          static void ksu_record_init_rc_path(const char *dpath)
          {
              if (!dpath) {
                  return;
              }
              strlcpy(ksu_last_rc_path, dpath, sizeof(ksu_last_rc_path));
              ksu_init_rc_seen = 1;
          }

          static int ksu_status_show(struct seq_file *m, void *v)
          {
              seq_printf(m, "execve_kp=%d\\n", ksu_execve_kp_ret);
              seq_printf(m, "sys_read_kp=%d\\n", ksu_sys_read_kp_ret);
              seq_printf(m, "sys_fstat_kp=%d\\n", ksu_sys_fstat_kp_ret);
              seq_printf(m, "input_kp=%d\\n", ksu_input_kp_ret);
              seq_printf(m, "init_rc_seen=%d\\n", ksu_init_rc_seen);
              seq_printf(m, "last_rc_path=%s\\n", ksu_last_rc_path[0] ? ksu_last_rc_path : "(none)");
              return 0;
          }

          static int ksu_status_open(struct inode *inode, struct file *file)
          {
              return single_open(file, ksu_status_show, NULL);
          }

          static const struct file_operations ksu_status_fops = {
              .owner = THIS_MODULE,
              .open = ksu_status_open,
              .read = seq_read,
              .llseek = seq_lseek,
              .release = single_release,
          };
          """

          ksud_block = """
          static const char *const ksu_sys_read_syms[] = {
              SYS_READ_SYMBOL,
              \"sys_read\",
              \"__se_sys_read\",
              \"SyS_read\",
              \"ksys_read\",
          };

          static const char *const ksu_sys_execve_syms[] = {
              SYS_EXECVE_SYMBOL,
              \"sys_execve\",
              \"__se_sys_execve\",
              \"SyS_execve\",
              \"do_execveat_common\",
          };

          static const char *const ksu_sys_fstat_syms[] = {
              SYS_FSTAT_SYMBOL,
              \"sys_newfstat\",
              \"__se_sys_newfstat\",
              \"SyS_newfstat\",
              \"vfs_fstat\",
          };

          static int register_kprobe_fallback(struct kprobe *kp,
                                              const char *const *syms,
                                              size_t count,
                                              const char *tag)
          {
              size_t i;
              int ret = -ENOENT;

              for (i = 0; i < count; i++) {
                  kp->symbol_name = syms[i];
                  ret = register_kprobe(kp);
                  if (!ret) {
                      pr_info(\"ksud: %s kprobe -> %s\\n\", tag, syms[i]);
                      return 0;
                  }
                  pr_warn(\"ksud: %s kprobe %s failed: %d\\n\", tag, syms[i], ret);
              }

              pr_err(\"ksud: %s kprobe all candidates failed\\n\", tag);
              return ret;
          }

          static int register_kretprobe_fallback(struct kretprobe *rp,
                                                 const char *const *syms,
                                                 size_t count,
                                                 const char *tag)
          {
              size_t i;
              int ret = -ENOENT;

              for (i = 0; i < count; i++) {
                  rp->kp.symbol_name = syms[i];
                  ret = register_kretprobe(rp);
                  if (!ret) {
                      pr_info(\"ksud: %s kretprobe -> %s\\n\", tag, syms[i]);
                      return 0;
                  }
                  pr_warn(\"ksud: %s kretprobe %s failed: %d\\n\", tag, syms[i], ret);
              }

              pr_err(\"ksud: %s kretprobe all candidates failed\\n\", tag);
              return ret;
          }
          """

          ksud_text = insert_after_anchor(ksud_text, "bool ksu_boot_completed __read_mostly = false;", ksu_debug_block)
          ksud_text = insert_after_anchor(ksud_text, "static struct kprobe input_event_kp", ksud_block)

          ksud_text = replace_call(
              ksud_text,
              r"ret\s*=\s*register_kprobe\(\s*&execve_kp\s*\)\s*;",
              "ret = register_kprobe_fallback(&execve_kp, ksu_sys_execve_syms, ARRAY_SIZE(ksu_sys_execve_syms), \"execve\");",
          )
          ksud_text = replace_call(
              ksud_text,
              r"pr_info\\(\\s*\\\"ksud:\\s*execve_kp:\\s*%d\\\\n\\\"\\s*,\\s*ret\\s*\\)\\s*;",
              "ksu_execve_kp_ret = ret;\\n    pr_info(\"ksud: execve_kp: %d\\n\", ret);",
          )
          ksud_text = replace_call(
              ksud_text,
              r"ret\s*=\s*register_kprobe\(\s*&sys_read_kp\s*\)\s*;",
              "ret = register_kprobe_fallback(&sys_read_kp, ksu_sys_read_syms, ARRAY_SIZE(ksu_sys_read_syms), \"sys_read\");",
          )
          ksud_text = replace_call(
              ksud_text,
              r"pr_info\\(\\s*\\\"ksud:\\s*sys_read_kp:\\s*%d\\\\n\\\"\\s*,\\s*ret\\s*\\)\\s*;",
              "ksu_sys_read_kp_ret = ret;\\n    pr_info(\"ksud: sys_read_kp: %d\\n\", ret);",
          )
          ksud_text = replace_call(
              ksud_text,
              r"ret\s*=\s*register_kretprobe\(\s*&sys_fstat_kp\s*\)\s*;",
              "ret = register_kretprobe_fallback(&sys_fstat_kp, ksu_sys_fstat_syms, ARRAY_SIZE(ksu_sys_fstat_syms), \"sys_fstat\");",
          )
          ksud_text = replace_call(
              ksud_text,
              r"pr_info\\(\\s*\\\"ksud:\\s*sys_fstat_kp:\\s*%d\\\\n\\\"\\s*,\\s*ret\\s*\\)\\s*;",
              "ksu_sys_fstat_kp_ret = ret;\\n    pr_info(\"ksud: sys_fstat_kp: %d\\n\", ret);",
          )
          ksud_text = replace_call(
              ksud_text,
              r"pr_info\\(\\s*\\\"ksud:\\s*input_event_kp:\\s*%d\\\\n\\\"\\s*,\\s*ret\\s*\\)\\s*;",
              "ksu_input_kp_ret = ret;\\n    pr_info(\"ksud: input_event_kp: %d\\n\", ret);",
          )

          ksud_text = replace_call(
              ksud_text,
              r"if\s*\\(\\s*strcmp\\(\\s*short_name,\\s*\\\"init\\.rc\\\"\\s*\\)\\s*\\)\\s*\\{\\s*// we are only interest `init\\.rc` file name file\\s*return\\s+false;\\s*\\}",
              "if (!strstr(short_name, \\\".rc\\\")) {\\n"
              "        return false;\\n"
              "    }",
          )

          ksud_text = replace_call(
              ksud_text,
              r"if\s*\\(\\s*strcmp\\(\\s*dpath,\\s*\\\"/system/etc/init/hw/init\\.rc\\\"\\s*\\)\\s*\\)\\s*\\{\\s*return\\s+false;\\s*\\}",
              "if (strncmp(dpath, \\\"/system/etc/init/\\\", 17) &&\\n"
              "        strncmp(dpath, \\\"/vendor/etc/init/\\\", 17) &&\\n"
              "        strncmp(dpath, \\\"/product/etc/init/\\\", 18) &&\\n"
              "        strncmp(dpath, \\\"/system_ext/etc/init/\\\", 22) &&\\n"
              "        strncmp(dpath, \\\"/odm/etc/init/\\\", 14) &&\\n"
              "        strncmp(dpath, \\\"/oem/etc/init/\\\", 14)) {\\n"
              "        return false;\\n"
              "    }",
          )
          ksud_text = replace_call(
              ksud_text,
              r"return\\s+true\\s*;",
              "ksu_record_init_rc_path(dpath);\\n    return true;",
          )

          ksud_text = replace_call(
              ksud_text,
              r"INIT_WORK\\(\\s*&stop_init_rc_hook_work\\s*,\\s*do_stop_init_rc_hook\\s*\\)\\s*;",
              "proc_create(\\\"ksu_status\\\", 0444, NULL, &ksu_status_fops);\\n    INIT_WORK(&stop_init_rc_hook_work, do_stop_init_rc_hook);",
          )

          if "proc_create(\"ksu_status\"" not in ksud_text:
            lines = ksud_text.splitlines()
            inserted = False
            for i, line in enumerate(lines):
              if line.strip() == "void ksu_ksud_init(void)":
                j = i + 1
                while j < len(lines) and "{" not in lines[j]:
                  j += 1
                if j < len(lines):
                  indent = lines[j][:len(lines[j]) - len(lines[j].lstrip())]
                  lines.insert(j + 1, indent + '    proc_create("ksu_status", 0444, NULL, &ksu_status_fops);')
                  inserted = True
                break
            if inserted:
              ksud_text = "\n".join(lines) + "\n"

          ksud.write_text(ksud_text)

          if supercalls.exists():
            super_text = supercalls.read_text()
            super_text = ensure_include(super_text, "#include <linux/kernel.h>")

            super_block = """
            static const char *const ksu_reboot_syms[] = {
                REBOOT_SYMBOL,
                \"sys_reboot\",
                \"__se_sys_reboot\",
            };

            static int register_kprobe_fallback(struct kprobe *kp,
                                                const char *const *syms,
                                                size_t count,
                                                const char *tag)
            {
                size_t i;
                int ret = -ENOENT;

                for (i = 0; i < count; i++) {
                    kp->symbol_name = syms[i];
                    ret = register_kprobe(kp);
                    if (!ret) {
                        pr_info("ksu: %s kprobe -> %s\n", tag, syms[i]);
                        return 0;
                    }
                    pr_warn("ksu: %s kprobe %s failed: %d\n", tag, syms[i], ret);
                }

                pr_err("ksu: %s kprobe all candidates failed\n", tag);
                return ret;
            }
            """
            super_text = insert_after_anchor(super_text, "static struct kprobe reboot_kp", super_block)
            super_text = replace_call(
                super_text,
                r"int\s+rc\s*=\s*register_kprobe\(\s*&reboot_kp\s*\)\s*;",
                "int rc = register_kprobe_fallback(&reboot_kp, ksu_reboot_syms, ARRAY_SIZE(ksu_reboot_syms), \"reboot\");",
            )
            supercalls.write_text(super_text)
          else:
            print(f"skip: {supercalls} not found")
          PY
          done

          mkdir -p ci_logs
          i=0
          for ksu_dir in "${ksu_dirs[@]}"; do
            if [ -f "${ksu_dir}/ksud.c" ]; then
              cp -f "${ksu_dir}/ksud.c" "ci_logs/ksud.${i}.c"
              i=$((i+1))
            fi
          done
          cp -f fs/read_write.c ci_logs/fs.read_write.c
          cp -f fs/exec.c ci_logs/fs.exec.c

      - name: 配置 defconfig
        id: config
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAIN_GCC64/bin:$TOOLCHAIN_GCC32/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN_GCC64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$TOOLCHAIN_GCC32/bin/arm-linux-androideabi-"
          export LOCALVERSION=

          DEFCONFIG="${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'vendor/laurus-perf_defconfig' }}"
          DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"

          if [ ! -f "${DEFCONFIG_PATH}" ]; then
            echo "defconfig 不存在：${DEFCONFIG_PATH}"
            exit 1
          fi

          # 对齐 stock 内核版本（避免 Wi-Fi vendor 模块 vermagic 不匹配）
          sed -i -E 's/^SUBLEVEL = .*/SUBLEVEL = 117/' Makefile
          sed -i -E 's/^EXTRAVERSION = .*/EXTRAVERSION =/' Makefile
          rm -f .scmversion

          if [ "$WITH_SUKISU" = "on" ]; then
            # non-GKI 使用 kprobe
            sed -i -E '/^CONFIG_KSU=/d' "${DEFCONFIG_PATH}"
            sed -i -E '/^# CONFIG_KSU is not set/d' "${DEFCONFIG_PATH}"
            sed -i -E '/^CONFIG_KSU_MANUAL_SU/d' "${DEFCONFIG_PATH}"
            sed -i -E '/^# CONFIG_KSU_MANUAL_SU is not set/d' "${DEFCONFIG_PATH}"
            printf '%s\n' \
              'CONFIG_KSU=y' \
              'CONFIG_KSU_MANUAL_SU=y' \
              'CONFIG_KPROBES=y' \
              'CONFIG_KRETPROBES=y' \
              'CONFIG_KPROBE_EVENTS=y' \
              'CONFIG_KALLSYMS=y' \
              'CONFIG_KALLSYMS_ALL=y' \
              'CONFIG_SECURITYFS=y' \
              'CONFIG_DEVTMPFS=y' \
              'CONFIG_DEVTMPFS_MOUNT=y' \
              'CONFIG_OVERLAY_FS=y' \
              >> "${DEFCONFIG_PATH}"
          fi

          mkdir -p out
          make O=out "$DEFCONFIG"

          if [ "$WITH_SUKISU" = "on" ]; then
            # KernelSU：kprobe 路线
            ./scripts/config --file out/.config -e KSU || true
            ./scripts/config --file out/.config -e KSU_MANUAL_SU || true
            ./scripts/config --file out/.config -e KPROBES || true
            ./scripts/config --file out/.config -e KRETPROBES || true
            ./scripts/config --file out/.config -e KPROBE_EVENTS || true
            ./scripts/config --file out/.config -e KALLSYMS || true
            ./scripts/config --file out/.config -e KALLSYMS_ALL || true
            ./scripts/config --file out/.config -e SECURITYFS || true
            ./scripts/config --file out/.config -e DEVTMPFS || true
            ./scripts/config --file out/.config -e DEVTMPFS_MOUNT || true
            ./scripts/config --file out/.config -e OVERLAY_FS || true
          fi

          # 保持 MODULE_SIG 以对齐 struct module，但关闭强制签名校验
          ./scripts/config --file out/.config -e MODULE_SIG || true
          ./scripts/config --file out/.config -d MODULE_SIG_FORCE || true
          ./scripts/config --file out/.config -d MODULE_SIG_ALL || true
          # 保持 MODVERSIONS，与 vendor 模块一致
          ./scripts/config --file out/.config -e MODVERSIONS || true

          # 对齐版本字符串，避免 vermagic 不匹配
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO || true
          ./scripts/config --file out/.config --set-str LOCALVERSION "-perf-g4732215" || true

          FORTIFY="${{ github.event_name == 'workflow_dispatch' && inputs.fortify || 'off' }}"
          if [ "$FORTIFY" = "on" ]; then
            ./scripts/config --file out/.config -e FORTIFY_SOURCE || true
          else
            # GCC 4.9 下 include/linux/string.h 的 FORTIFY memcpy 会触发 __read_overflow2 编译期错误
            ./scripts/config --file out/.config -d FORTIFY_SOURCE || true
          fi

          make O=out olddefconfig

          if [ "$WITH_SUKISU" = "on" ]; then
            # olddefconfig 后确认 kprobe 仍保持开启
            ./scripts/config --file out/.config -e KSU || true
            ./scripts/config --file out/.config -e KSU_MANUAL_SU || true
            ./scripts/config --file out/.config -e KPROBES || true
            ./scripts/config --file out/.config -e KRETPROBES || true
            ./scripts/config --file out/.config -e KPROBE_EVENTS || true
            ./scripts/config --file out/.config -e KALLSYMS || true
            ./scripts/config --file out/.config -e KALLSYMS_ALL || true
            ./scripts/config --file out/.config -e SECURITYFS || true
            ./scripts/config --file out/.config -e DEVTMPFS || true
            ./scripts/config --file out/.config -e DEVTMPFS_MOUNT || true
            ./scripts/config --file out/.config -e OVERLAY_FS || true

            # 再次确保模块签名/版本字符串设置生效
            ./scripts/config --file out/.config -e MODULE_SIG || true
            ./scripts/config --file out/.config -d MODULE_SIG_FORCE || true
            ./scripts/config --file out/.config -d MODULE_SIG_ALL || true
            ./scripts/config --file out/.config -e MODVERSIONS || true
            ./scripts/config --file out/.config -d LOCALVERSION_AUTO || true
            ./scripts/config --file out/.config --set-str LOCALVERSION "-perf-g4732215" || true

            make O=out olddefconfig
          fi

          # 保持默认版本字符串，避免 vendor 模块 vermagic 不匹配（例如 Wi-Fi 驱动）
      - name: 编译
        id: build
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAIN_GCC64/bin:$TOOLCHAIN_GCC32/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN_GCC64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$TOOLCHAIN_GCC32/bin/arm-linux-androideabi-"
          export LOCALVERSION=

          BUILD_DTBO="${{ github.event_name == 'workflow_dispatch' && inputs.build_dtbo || 'off' }}"

          if [ "$BUILD_DTBO" = "on" ]; then
            # dtbo (/plugin/;) 需要 -@ 才能生成符号/修复信息
            make -j"$(nproc)" O=out Image.gz-dtb V=1 DTC_FLAGS="-@" 2>&1 | tee build.log
          else
            # 先确保能编译出内核镜像；dtbo 问题后续再单独修
            make -j"$(nproc)" O=out Image.gz V=1 2>&1 | tee build.log

            mkdir -p dist
            rm -f dist/dtb

            # 编译 trinket 相关 dtb（失败跳过，后续按 size 白名单拼接）
            for dts in $(find arch/arm64/boot/dts/qcom -maxdepth 1 -name 'trinket*.dts' ! -name '*-overlay.dts' -print | sort); do
              dtb="$(basename "${dts%.dts}.dtb")"
              if make -j"$(nproc)" O=out "qcom/${dtb}" V=1 2>&1 | tee -a build.log; then
                echo "built dtb: ${dtb}" | tee -a build.log
              else
                echo "skip dtb build failed: ${dtb}" | tee -a build.log
              fi
            done

            KERNEL_REF="${{ github.event_name == 'workflow_dispatch' && inputs.kernel_branch || 'laurus-q-oss-ci' }}"
            STOCK_DTB_B64="ci_assets/laurus_q_dtb.bin.gz.b64"
            if [[ "${KERNEL_REF}" == laurus-p-* ]]; then
              STOCK_DTB_B64="ci_assets/laurus_p_dtb.bin.gz.b64"
            fi

            use_stock_boot_dtb=0
            if [ -f "${STOCK_DTB_B64}" ]; then
              if base64 -d "${STOCK_DTB_B64}" | gzip -d > dist/dtb; then
                echo "use dtb blob: ${STOCK_DTB_B64}" | tee -a build.log
              else
                echo "decode ${STOCK_DTB_B64} failed, fallback to stock boot dtb" | tee -a build.log
                use_stock_boot_dtb=1
              fi
            else
              echo "missing ${STOCK_DTB_B64}, fallback to stock boot dtb" | tee -a build.log
              use_stock_boot_dtb=1
            fi

            if [ "${use_stock_boot_dtb}" = "1" ]; then
              test -f ci_assets/stock_boot.img.gz.b64
              python3 - <<'PY'
              import base64
              import gzip
              from pathlib import Path

              raw = Path("ci_assets/stock_boot.img.gz.b64").read_bytes()
              if raw[:2] == b"\x1f\x8b":
                  data = raw
              else:
                  text = raw.decode("utf-8", errors="ignore")
                  data = base64.b64decode("".join(text.split()))
              Path("dist/stock_boot_for_dtb.img").write_bytes(gzip.decompress(data))
              PY

              rm -rf dist/stock_boot_for_dtb
              mkdir -p dist/stock_boot_for_dtb
              python3 tools/unpack_bootimg.py \
                --boot_img dist/stock_boot_for_dtb.img \
                --out dist/stock_boot_for_dtb \
                --format=mkbootimg -0 >/dev/null
              test -f dist/stock_boot_for_dtb/dtb
              cp -f dist/stock_boot_for_dtb/dtb dist/dtb
              echo "use dtb from stock boot template" | tee -a build.log
            fi

            # 生成 CC 9e/Trinket 多 DTB Image.gz-dtb（直接用于打包/刷机）
            cat out/arch/arm64/boot/Image.gz dist/dtb > dist/Image.gz-dtb
          fi

      - name: 打包 AnyKernel3（可直接刷）
        id: package
        if: steps.build.outcome == 'success'
        run: |
          set -euxo pipefail
          mkdir -p dist

          # build_dtbo=on 时，尝试复用 out 里生成的 Image.gz-dtb
          if [ ! -f dist/Image.gz-dtb ] && [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp -f out/arch/arm64/boot/Image.gz-dtb dist/Image.gz-dtb
          fi

          test -f dist/Image.gz-dtb

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel3
          cp -f dist/Image.gz-dtb anykernel3/Image.gz-dtb

          # 仅做最小定制：限制设备代号（CC 9e=laurus；同平台 Mi A3=laurel_sprout）
          sed -i \
            -e 's/^do.devicecheck=.*/do.devicecheck=1/' \
            -e 's/^device.name1=.*/device.name1=laurus/' \
            -e 's/^device.name2=.*/device.name2=laurel_sprout/' \
            anykernel3/anykernel.sh || true

          (cd anykernel3 && zip -r9 ../dist/AnyKernel3-laurus-${{ github.run_id }}.zip . -x '.git/*')

      - name: 生成 boot.img（可 fastboot 刷入）
        id: bootimg
        if: steps.build.outcome == 'success'
        run: |
          set -euxo pipefail
          mkdir -p dist
          test -f out/arch/arm64/boot/Image.gz
          cp -f out/arch/arm64/boot/Image.gz dist/Image.gz

          # 确认内核包含 KernelSU（防止打包回 stock 内核）
          python3 - <<'PY'
          import gzip
          import sys
          from pathlib import Path

          data = Path("dist/Image.gz").read_bytes()
          if data[:2] == b"\x1f\x8b":
            try:
              data = gzip.decompress(data)
            except Exception:
              # 部分环境下 gzip 末尾附带数据，容错解压
              import zlib
              d = zlib.decompressobj(16 + zlib.MAX_WBITS)
              data = d.decompress(data)
          if b"KernelSU" not in data:
            print("KernelSU string not found in dist/Image.gz")
            sys.exit(1)
          print("KernelSU string found in dist/Image.gz")
          PY

          # 使用 stock boot 模板重打（避免刷机卡 fastboot）
          test -f ci_assets/stock_boot.img.gz.b64
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          path = Path("ci_assets/stock_boot.img.gz.b64")
          raw = path.read_bytes()
          # 如果文件本身已是 gzip（二进制），直接解压；否则当作 base64 文本解码
          if raw[:2] == b"\x1f\x8b":
              data = raw
          else:
              text = raw.decode("utf-8", errors="ignore")
              data = base64.b64decode("".join(text.split()))
          Path("dist/stock_boot.img").write_bytes(gzip.decompress(data))
          PY

          rm -rf repack
          mkdir -p repack/stock

          python3 tools/unpack_bootimg.py \
            --boot_img dist/stock_boot.img \
            --out repack/stock \
            --format=mkbootimg -0 > repack/mkbootimg_args

          # 用 stock boot 参数重建，只替换 kernel（用 -0 避免 cmdline 被拆分）
          mapfile -d '' -t MKBOOTIMG_ARGS < repack/mkbootimg_args
          python3 tools/mkbootimg.py "${MKBOOTIMG_ARGS[@]}" \
            --kernel out/arch/arm64/boot/Image.gz \
            --ramdisk repack/stock/ramdisk \
            --dtb repack/stock/dtb \
            -o dist/boot.img

          # 校验 boot.img 确实使用了新内核
          mkdir -p repack/check
          python3 tools/unpack_bootimg.py \
            --boot_img dist/boot.img \
            --out repack/check \
            --format=mkbootimg -0 >/dev/null
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          def sha(path):
            return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          if sha("repack/check/kernel") != sha("dist/Image.gz"):
            raise SystemExit("boot.img kernel mismatch with dist/Image.gz")
          print("boot.img kernel matches dist/Image.gz")
          PY

          # laurus boot 分区固定 64MB，做一次 truncate 与 stock 对齐
          truncate -s 64M dist/boot.img
          ls -lh dist/boot.img

      - name: 写入精简日志（方便无鉴权查看）
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p ci_logs
          outfile="ci_logs/${{ github.run_id }}.txt"
          {
            echo "run_id=${{ github.run_id }}"
            echo "head_sha=${{ github.sha }}"
            echo "kernel_ref=${{ github.event_name == 'workflow_dispatch' && inputs.kernel_branch || 'laurus-q-oss-ci' }}"
            echo "defconfig=${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'vendor/laurus-perf_defconfig' }}"
            echo "fortify=${{ github.event_name == 'workflow_dispatch' && inputs.fortify || 'off' }}"
            echo "build_dtbo=${{ github.event_name == 'workflow_dispatch' && inputs.build_dtbo || 'off' }}"
            echo "with_sukisu=${WITH_SUKISU}"
            echo
            echo "==== step outcomes ===="
            echo "checkout=${{ steps.checkout.outcome }}"
            echo "deps=${{ steps.deps.outcome }}"
            echo "toolchain=${{ steps.toolchain.outcome }}"
            echo "sukisu=${{ steps.sukisu.outcome }}"
            echo "config=${{ steps.config.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "package=${{ steps.package.outcome }}"
            echo
            echo "==== ksu config snapshot (out/.config) ===="
            if [ -f out/.config ]; then
              grep -nE "KSU|KPROBES|KRETPROBES|KPROBES_ON_FTRACE|KPROBE_EVENTS|KALLSYMS|FTRACE" out/.config 2>&1 | head -n 200 || true
            else
              echo "out/.config not found"
            fi
            echo
            echo "==== System.map syscall symbols ===="
            if [ -f out/System.map ]; then
              grep -E "T.*(sys_read|SyS_read|sys_execve|SyS_execve|sys_newfstat|SyS_newfstat)" out/System.map 2>&1 | head -n 50 || true
            elif [ -f out/arch/arm64/boot/System.map ]; then
              grep -E "T.*(sys_read|SyS_read|sys_execve|SyS_execve|sys_newfstat|SyS_newfstat)" out/arch/arm64/boot/System.map 2>&1 | head -n 50 || true
            else
              echo "System.map not found"
            fi
            echo
            echo "==== manual hook callsites ===="
            grep -nE "ksu_handle_sys_read|ksu_init_rc_hook" ci_logs/fs.read_write.c 2>&1 | head -n 40 || true
            grep -nE "ksu_handle_execveat|ksu_execveat_hook|ksu_handle_execveat_sucompat" ci_logs/fs.exec.c 2>&1 | head -n 40 || true
            echo
            echo "==== ksud.o compile lines ===="
            if [ -f build.log ]; then
              grep -nE "ksud\\.o" build.log 2>&1 | head -n 50 || true
            else
              echo "build.log not found"
            fi
            echo
            echo "==== ksud.c proc_create ===="
            if ls ci_logs/ksud*.c >/dev/null 2>&1; then
              grep -n "proc_create(\\\"ksu_status\\\"" ci_logs/ksud*.c 2>&1 | head -n 20 || true
            else
              echo "ci_logs/ksud*.c not found"
            fi
            echo
            echo "==== ksu_status strings in Image.gz ===="
            if [ -f out/arch/arm64/boot/Image.gz ]; then
              (gzip -dc out/arch/arm64/boot/Image.gz 2>/dev/null | strings | grep -E "ksu_status|init_rc_seen|last_rc_path" | head -n 50) || true
            else
              echo "Image.gz not found"
            fi
            echo
            echo "==== artifacts existence ===="
            ls -l build.log 2>&1 || true
            ls -l out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/trinket.dtb 2>&1 || true
            ls -l dist/Image.gz dist/Image.gz-dtb dist/AnyKernel3-laurus-${{ github.run_id }}.zip dist/boot.img 2>&1 || true
            echo
            echo "==== build.log errors (tail 200) ===="
            grep -nE "error:|fatal error:" build.log 2>&1 | tail -n 200 || true
            echo
            echo "==== make failures (tail 120) ===="
            grep -nE "make(\[[0-9]+\])?: \*\*\*|make: \*\*\*|Error [0-9]+" build.log 2>&1 | tail -n 120 || true
            echo
            echo "==== dtc/dts errors (tail 200) ===="
            grep -nE "FATAL ERROR|syntax error|parse error|Error:" build.log 2>&1 | tail -n 200 || true
            echo
            echo "==== forbidden warnings (tail 80) ===="
            grep -n "warn, forbidden warning" build.log 2>&1 | tail -n 80 || true
            echo
            echo "==== bad_copy / fortify hits (head 200) ===="
            grep -nE "__bad_copy_(to|from)|copy (source|destination) size is too small|__compiletime_error\(\"copy (source|destination) size is too small\"\)|__read_overflow2|FORTIFY|__check_object_size" build.log 2>&1 | head -n 200 || true
            echo
            echo "==== bad_copy context (first 3 hits, each +/-60 lines) ===="
            hits="$(grep -nE "__bad_copy_(to|from)" build.log 2>/dev/null | head -n 3 | cut -d: -f1 | tr '\n' ' ' || true)"
            if [ -n "${hits}" ]; then
              for n in ${hits}; do
                start=$((n-60)); end=$((n+60)); if [ "$start" -lt 1 ]; then start=1; fi
                echo "--- context around build.log:$n (lines $start-$end) ---"
                sed -n "${start},${end}p" build.log 2>&1 || true
                echo
              done
            else
              echo "(no __bad_copy_* strings found in build.log)"
            fi
            echo
            echo "==== tail build.log (last 1200) ===="
            tail -n 1200 build.log 2>&1 || true
          } > "$outfile"

          cp -f "$outfile" ci_logs/latest.txt
          echo "Wrote $outfile"

      - name: 上传产物（无论成功失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laurus-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            build.log
            ci_logs/latest.txt
            ci_logs/ksud*.c
            ci_logs/fs.read_write.c
            ci_logs/fs.exec.c
            out/.config
            out/System.map
            out/arch/arm64/boot/System.map
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/qcom/trinket.dtb
            dist/Image.gz
            dist/Image.gz-dtb
            dist/AnyKernel3-laurus-${{ github.run_id }}.zip
            dist/boot.img
